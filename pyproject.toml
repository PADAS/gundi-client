[project]
name = "gundi-client-v2"
dynamic = ["version"]
description = "An async client for Gundi's API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Chris Doehring", email = "chrisdo@earthranger.com" },
    { name = "Mariano M", email = "marianom@earthranger.com" },
    { name = "Victor Garcia", email = "victorg@earthranger.com" },
]

dependencies = [
    "environs>=9.5,<12",
    "pydantic>=1.10,<2",
    # <1: httpx 1.0 removes top-level exports we import (see issue #50);
    # lift deliberately in a release ported to the httpx 1.0 API.
    "httpx>=0.28,<1",
    "gundi-core>=1.5.8,<3",
]

# [project.optional-dependencies] (not [dependency-groups]) so that
# `pip install -e ".[docs]"` works in CI without requiring uv.
[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-exclude>=1.0",
    "mkdocstrings[python]>=0.24",
]
# The `gundi` console command. Kept out of the core install so a plain
# `import gundi_client_v2` never requires Typer; install with
# `pip install gundi-client-v2[cli]`.
cli = [
    "typer>=0.12",
]

# Console entry point for the optional CLI (requires the `cli` extra).
[project.scripts]
gundi = "gundi_client_v2.cli:app"

[dependency-groups]
dev = [
    "respx>=0.22",
    "black>=23.1",
    "pytest>=7.2",
    "pytest-asyncio>=0.20",
    "typer>=0.12",
]

[tool.hatch.version]
path = "gundi_client_v2/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
